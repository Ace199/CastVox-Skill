[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "makesound-skill"
version = "1.2.0.dev1"
description = "Harness-independent local configuration and voice assets for MakeSoundSkill"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
makesound = "makesound.cli:main"

[tool.setuptools.packages.find]
include = ["makesound*"]
